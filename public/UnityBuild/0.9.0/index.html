<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity Web Player | Jumper</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <!-- Keep only loader preload (low risk). Avoid preloading large .br blobs while debugging cache/header issues. -->
    <link rel="preload" href="Build/Jumper.loader.js" as="script" />

    <style>
      html, body, #unity-container, #unity-canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Jumper</div>
      </div>
    </div>

    <script>
      var canvas = document.querySelector("#unity-canvas");

      function focusCanvas() {
        try {
          canvas.setAttribute("tabindex", "-1");
          canvas.focus({ preventScroll: true });
        } catch (e) {}
      }
      window.focusUnity = function () { focusCanvas(); };

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type === "error") div.style = "background: red; padding: 10px;";
        else {
          if (type === "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            if (div.parentNode === warningBanner) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Jumper.loader.js";

      // Optional debug cache-bust: /index.html?v=123
      var BUILD_QUERY = "";
      try {
        var v = new URLSearchParams(window.location.search).get("v");
        if (v) BUILD_QUERY = "?v=" + encodeURIComponent(v);
      } catch (e) {}

      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Jumper.data.br" + BUILD_QUERY,
        frameworkUrl: buildUrl + "/Jumper.framework.js.br" + BUILD_QUERY,
        codeUrl: buildUrl + "/Jumper.wasm.br" + BUILD_QUERY,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Jumper",
        productVersion: "0.9.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      window.navigateToRanking = function () {
        window.top.location.href = window.location.origin + "/#ranking";
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) return;

        const data = event.data;

        if (data && data.type === "focus") {
          focusCanvas();
          return;
        }

        if (data?.type === "walletData" && typeof data.payload === "object") {
          const jsonData = JSON.stringify(data.payload);
          if (window.unityInstance) {
            window.unityInstance.SendMessage("Game", "SetUserData", jsonData);
          }
        }
      });

      window.requestWalletData = function () {
        setTimeout(function () {
          const source =
            window.parent && window.parent !== window && window.parent.currentWalletData
              ? window.parent.currentWalletData
              : window.currentWalletData;

          if (!source) return;

          const jsonData = JSON.stringify(source);
          if (window.unityInstance) {
            window.unityInstance.SendMessage("Game", "SetUserData", jsonData);
          }
        }, 500);
      };

      var script = document.createElement("script");
      script.src = loaderUrl + BUILD_QUERY;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        })
          .then((unityInstance) => {
            window.unityInstance = unityInstance;
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = () => {
              unityInstance.SetFullscreen(1);
            };
            focusCanvas();
          })
          .catch((message) => {
            console.error("Unity failed to load:", message);
            unityShowBanner(message, "error");
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
