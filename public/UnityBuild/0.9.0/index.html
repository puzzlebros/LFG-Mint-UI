<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Unity Web Player | Jumper</title>

    <link rel="shortcut icon" href="TemplateData/favicon.ico" />
    <link rel="stylesheet" href="TemplateData/style.css" />

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

    <link rel="preload" href="Build/Jumper.loader.js" as="script" />

    <style>
      html, body, #unity-container, #unity-canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="-1"></canvas>

      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>

      <div id="unity-warning"></div>

      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Jumper</div>
      </div>
    </div>

    <script>
      // ─────────────────────────────────────────────────────────────
      // Iframe -> Parent unified logger
      // ─────────────────────────────────────────────────────────────
      function postToParent(type, msg, obj) {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: type, msg: msg, obj: obj }, window.location.origin);
          }
        } catch (e) {}
      }

      function ilog(msg, obj) { postToParent("iframeLog", msg, obj); }
      function iprobe(msg, obj) { postToParent("iframeProbe", msg, obj); }
      function iunity(msg, obj) { postToParent("iframeUnity", msg, obj); }

      // Capture errors inside iframe
      window.addEventListener("error", function (e) {
        ilog("window.error", { message: e.message, filename: e.filename, lineno: e.lineno, colno: e.colno });
      });
      window.addEventListener("unhandledrejection", function (e) {
        ilog("unhandledrejection", { reason: e.reason ? String(e.reason) : "unknown" });
      });

      // ─────────────────────────────────────────────────────────────
      // Canvas focus
      // ─────────────────────────────────────────────────────────────
      var canvas = document.querySelector("#unity-canvas");

      function focusCanvas() {
        try {
          canvas.setAttribute("tabindex", "-1");
          canvas.focus({ preventScroll: true });
          ilog("focusCanvas() ok");
        } catch (e) {
          ilog("focusCanvas() failed", { err: String(e) });
        }
      }
      window.focusUnity = function () { focusCanvas(); };

      // ─────────────────────────────────────────────────────────────
      // Unity banner
      // ─────────────────────────────────────────────────────────────
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);

        if (type === "error") div.style = "background: red; padding: 10px;";
        else {
          if (type === "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            if (div.parentNode === warningBanner) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();

        // forward to parent log stream too
        iunity("unityShowBanner", { type: type, msg: msg });
      }

      // ─────────────────────────────────────────────────────────────
      // Query flags
      // ─────────────────────────────────────────────────────────────
      var QS = "";
      try { QS = window.location.search || ""; } catch (e) {}

      function qget(key) {
        try { return new URLSearchParams(window.location.search).get(key); } catch (e) { return null; }
      }

      var v = qget("v") || "";
      var mlog = qget("mlog") === "1";

      ilog("iframe boot", { href: window.location.href, v: v, mlog: mlog });

      // ─────────────────────────────────────────────────────────────
      // Probe helper inside iframe
      // ─────────────────────────────────────────────────────────────
      async function probe(url) {
        try {
          iprobe("fetch " + url);
          var res = await fetch(url, { method: "GET", cache: "no-store" });

          var headers = {
            "content-type": res.headers.get("content-type"),
            "content-encoding": res.headers.get("content-encoding"),
            "cache-control": res.headers.get("cache-control"),
            "vary": res.headers.get("vary"),
            "etag": res.headers.get("etag"),
            "content-length": res.headers.get("content-length"),
            "x-vercel-cache": res.headers.get("x-vercel-cache"),
            "x-matched-path": res.headers.get("x-matched-path"),
          };

          iprobe("result " + res.status + " " + res.statusText, { url: url, headers: headers });

          // read small prefix to detect HTML being served
          var buf = await res.clone().arrayBuffer();
          var bytes = new Uint8Array(buf.slice(0, 24));
          var ascii = Array.from(bytes).map(b => (b >= 32 && b < 127) ? String.fromCharCode(b) : ".").join("");
          iprobe("first24", { url: url, ascii: ascii });

        } catch (e) {
          iprobe("ERROR " + url, { err: String(e) });
        }
      }

      // ─────────────────────────────────────────────────────────────
      // Listen to parent messages
      // ─────────────────────────────────────────────────────────────
      window.addEventListener("message", function (event) {
        if (event.origin !== window.location.origin) return;
        var data = event.data;

        if (!data || typeof data !== "object") return;

        if (data.type === "focus") {
          focusCanvas();
          return;
        }

        if (data.type === "probe") {
          // Probe the same URLs Unity will load
          var buildUrl = "Build";
          var suffix = v ? ("?v=" + encodeURIComponent(v)) : "";
          probe(buildUrl + "/Jumper.loader.js" + suffix);
          probe(buildUrl + "/Jumper.framework.js.br" + suffix);
          probe(buildUrl + "/Jumper.wasm.br" + suffix);
          probe(buildUrl + "/Jumper.data.br" + suffix);
          return;
        }

        if (data.type === "walletData" && typeof data.payload === "object") {
          var jsonData = JSON.stringify(data.payload);
          if (window.unityInstance) {
            window.unityInstance.SendMessage("Game", "SetUserData", jsonData);
            ilog("walletData forwarded to Unity", { bytes: jsonData.length });
          } else {
            ilog("walletData received but unityInstance not ready yet");
          }
          return;
        }
      });

      // ─────────────────────────────────────────────────────────────
      // Unity config (Brotli precompressed)
      // ─────────────────────────────────────────────────────────────
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/Jumper.loader.js";

      var BUILD_QUERY = v ? ("?v=" + encodeURIComponent(v)) : "";

      var config = {
        arguments: [],
        dataUrl: buildUrl + "/Jumper.data.br" + BUILD_QUERY,
        frameworkUrl: buildUrl + "/Jumper.framework.js.br" + BUILD_QUERY,
        codeUrl: buildUrl + "/Jumper.wasm.br" + BUILD_QUERY,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Jumper",
        productVersion: v || "0.9.0",
        showBanner: unityShowBanner,
        compressionFormat: "br",
      };

      // Mobile / Desktop
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement("meta");
        meta.name = "viewport";
        meta.content =
          "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
        document.getElementsByTagName("head")[0].appendChild(meta);

        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      } else {
        canvas.style.width = "100%";
        canvas.style.height = "100%";
      }

      // Ranking bridge
      window.navigateToRanking = function () {
        window.top.location.href = window.location.origin + "/#ranking";
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      // Boot Unity
      var script = document.createElement("script");
      script.src = loaderUrl + BUILD_QUERY;

      script.onload = function () {
        iunity("loader loaded", { src: script.src });

        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
          iunity("progress", { progress: progress });
        })
          .then(function (unityInstance) {
            window.unityInstance = unityInstance;
            document.querySelector("#unity-loading-bar").style.display = "none";
            document.querySelector("#unity-fullscreen-button").onclick = function () {
              unityInstance.SetFullscreen(1);
            };

            iunity("unity ready");
            focusCanvas();

            // Let Unity request wallet data if it wants
            window.requestWalletData = function () {
              setTimeout(function () {
                var source =
                  window.parent && window.parent !== window && window.parent.currentWalletData
                    ? window.parent.currentWalletData
                    : window.currentWalletData;

                if (!source) {
                  ilog("requestWalletData: no source");
                  return;
                }

                var jsonData = JSON.stringify(source);
                if (window.unityInstance) {
                  window.unityInstance.SendMessage("Game", "SetUserData", jsonData);
                  ilog("requestWalletData -> Unity", { bytes: jsonData.length });
                }
              }, 500);
            };
          })
          .catch(function (message) {
            iunity("Unity failed to load", { message: String(message) });
            unityShowBanner(String(message), "error");
          });
      };

      script.onerror = function () {
        iunity("loader failed to load", { src: script.src });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
